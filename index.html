<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOU Production Log</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d1cbc4">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root { --main-color: #d1cbc4; --accent-color: #8c847c; --bg-color: #faf9f8; --text-color: #5a5a5a; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        
        #video-container { 
            position: relative; width: 100%; max-width: 400px; margin: 0 auto 20px; 
            border-radius: 12px; overflow: hidden; background: #000;
            aspect-ratio: 3 / 2;
            display: none;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); max-width: 400px; margin: 0 auto 20px; }
        textarea { width: 100%; border: 1px solid var(--main-color); border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 16px; height: 100px; margin-bottom: 10px; resize: none; }
        
        .btn { border: none; padding: 12px 24px; border-radius: 25px; font-size: 15px; cursor: pointer; margin: 5px; }
        .btn-main { background-color: var(--main-color); color: white; }
        .btn-accent { background-color: var(--accent-color); color: white; }
        .btn-outline { background-color: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); }
        
        #crop-viewport {
            position: relative; width: 100%; aspect-ratio: 3/2; 
            overflow: hidden; border-radius: 8px; margin-bottom: 15px; 
            background: #eee; cursor: move; touch-action: none;
        }
        #drag-img { position: absolute; top: 0; left: 0; pointer-events: none; }

        #log-list { max-width: 400px; margin: 30px auto; text-align: left; }
        .log-item { background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .log-item img { width: 100%; border-radius: 4px; }

        #action-buttons { margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="camera-view" autoplay playsinline></video>
    </div>

    <div id="action-buttons">
        <button id="start-btn" class="btn btn-main">カメラを起動</button>
        <button id="file-btn" class="btn btn-main">ファイルを選択</button>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        
        <button id="shutter-btn" class="btn btn-accent" style="display:none;">撮影する</button>
        <button id="stop-btn" class="btn btn-outline" style="display:none;">カメラを停止</button>
    </div>

    <div id="memo-area" style="display:none;" class="card">
        <canvas id="export-canvas" width="800" height="800" style="display:none;"></canvas>
        
        <div id="crop-viewport">
            <img id="drag-img">
        </div>

        <textarea id="memo-input" placeholder="メモ…"></textarea>
        <button id="save-btn" class="btn btn-accent">保存</button>
        <button onclick="location.reload()" class="btn">やり直し</button>
    </div>

    <div id="log-list"></div>

    <script>
        const video = document.getElementById('camera-view');
        const videoContainer = document.getElementById('video-container');
        const exportCanvas = document.getElementById('export-canvas');
        const dragImg = document.getElementById('drag-img');
        const viewport = document.getElementById('crop-viewport');
        const memoArea = document.getElementById('memo-area');
        
        const startBtn = document.getElementById('start-btn');
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const shutterBtn = document.getElementById('shutter-btn');
        const stopBtn = document.getElementById('stop-btn');
        const saveBtn = document.getElementById('save-btn');
        const logList = document.getElementById('log-list');

        let originalImg = null;
        let currentStream = null;
        let imgPos = { x: 0, y: 0 };
        let isDragging = false;
        let startPos = { x: 0, y: 0 };

        function getFormattedDate() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${hh}:${mm}`;
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            videoContainer.style.display = 'none';
            shutterBtn.style.display = 'none';
            stopBtn.style.display = 'none';
            startBtn.style.display = 'inline-block';
            fileBtn.style.display = 'inline-block';
        }

        function initImage(source) {
            originalImg = source;
            const vpW = viewport.clientWidth;
            const vpH = viewport.clientHeight;
            const imgAspect = source.width / source.height;
            const vpAspect = vpW / vpH;

            if (imgAspect > vpAspect) {
                dragImg.style.height = '100%';
                dragImg.style.width = 'auto';
                setTimeout(() => {
                    imgPos.x = (vpW - dragImg.clientWidth) / 2;
                    imgPos.y = 0;
                    updateImgStyle();
                }, 10);
            } else {
                dragImg.style.width = '100%';
                dragImg.style.height = 'auto';
                setTimeout(() => {
                    imgPos.x = 0;
                    imgPos.y = (vpH - dragImg.clientHeight) / 2;
                    updateImgStyle();
                }, 10);
            }
            dragImg.src = source.src;
            memoArea.style.display = 'block';
        }

        function updateImgStyle() {
            dragImg.style.left = `${imgPos.x}px`;
            dragImg.style.top = `${imgPos.y}px`;
        }

        viewport.onpointerdown = (e) => {
            isDragging = true;
            startPos = { x: e.clientX - imgPos.x, y: e.clientY - imgPos.y };
            viewport.setPointerCapture(e.pointerId);
        };

        viewport.onpointermove = (e) => {
            if (!isDragging) return;
            imgPos.x = e.clientX - startPos.x;
            imgPos.y = e.clientY - startPos.y;

            const vpW = viewport.clientWidth;
            const vpH = viewport.clientHeight;
            const imgW = dragImg.clientWidth;
            const imgH = dragImg.clientHeight;

            if (imgPos.x > 0) imgPos.x = 0;
            if (imgPos.y > 0) imgPos.y = 0;
            if (imgPos.x < vpW - imgW) imgPos.x = vpW - imgW;
            if (imgPos.y < vpH - imgH) imgPos.y = vpH - imgH;

            updateImgStyle();
        };

        viewport.onpointerup = () => { isDragging = false; };

        startBtn.onclick = async () => {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                video.srcObject = currentStream;
                videoContainer.style.display = 'block';
                startBtn.style.display = 'none';
                fileBtn.style.display = 'none';
                shutterBtn.style.display = 'inline-block';
                stopBtn.style.display = 'inline-block';
            } catch (err) { alert("カメラを起動できませんでした。"); }
        };

        stopBtn.onclick = stopCamera;

        shutterBtn.onclick = () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const img = new Image();
            img.onload = () => { initImage(img); stopCamera(); };
            img.src = canvas.toDataURL('image/png');
        };

        fileBtn.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => { initImage(img); startBtn.style.display = 'none'; fileBtn.style.display = 'none'; };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        saveBtn.onclick = () => {
            const memoText = document.getElementById('memo-input').value;
            const fullDateStr = getFormattedDate();
            const ctx = exportCanvas.getContext('2d');
            const canvasSize = 800;

            const scale = originalImg.width / dragImg.clientWidth;
            const sx = -imgPos.x * scale;
            const sy = -imgPos.y * scale;
            const sw = viewport.clientWidth * scale;
            const sh = viewport.clientHeight * scale;

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            const photoW = canvasSize * 0.84;
            const photoH = photoW / 1.5;
            const xPadding = (canvasSize - photoW) / 2;
            const yPaddingTop = canvasSize * 0.08;

            ctx.drawImage(originalImg, sx, sy, sw, sh, xPadding, yPaddingTop, photoW, photoH);
            ctx.fillStyle = "#5a5a5a";
            ctx.font = "32px sans-serif";
            ctx.fillText(memoText, xPadding * 1.2, yPaddingTop + photoH + 80);
            ctx.font = "24px sans-serif";
            ctx.fillText(fullDateStr, xPadding * 1.2, canvasSize - 60);

            const finalImage = exportCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `SOU_Log_${new Date().getTime()}.png`;
            link.href = finalImage;
            link.click();

            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<img src="${finalImage}">`;
            logList.innerHTML = '';
            logList.appendChild(item);

            memoArea.style.display = 'none';
            startBtn.style.display = 'inline-block';
            fileBtn.style.display = 'inline-block';
            document.getElementById('memo-input').value = '';
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>

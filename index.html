<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOU - Production Log -</title>
    <style>
        :root { --main-color: #d1cbc4; --accent-color: #8c847c; --bg-color: #faf9f8; --text-color: #5a5a5a; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.6; }
        h3 { font-weight: normal; letter-spacing: 0.1em; color: var(--accent-color); margin-bottom: 10px; }
        
        /* 入力エリア共通 */
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); max-width: 400px; margin: 0 auto 20px; }
        input, textarea { width: 100%; border: 1px solid var(--main-color); border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 14px; margin-bottom: 10px; }
        
        /* ライブカメラ */
        #video-container { width: 100%; max-width: 400px; margin: 0 auto 20px; border-radius: 12px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; }
        
        /* ボタン */
        .btn { border: none; padding: 12px 24px; border-radius: 25px; font-size: 15px; cursor: pointer; margin: 5px; transition: 0.3s; }
        .btn-main { background-color: var(--main-color); color: white; }
        .btn-accent { background-color: var(--accent-color); color: white; }
        .btn-copy { background-color: var(--accent-color); color: white; width: 100%; max-width: 400px; margin-top: 20px; }

        #log-list { max-width: 400px; margin: 30px auto; text-align: left; }
        .log-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .log-item img { width: 100%; border-radius: 6px; }
    </style>
</head>
<body>

    <h3>SOU - Production Log -</h3>

    <div class="card">
        <input type="text" id="project-name" placeholder="制作物の名前（例：星形ランプ）">
    </div>

    <div id="video-container">
        <video id="camera-view" autoplay playsinline></video>
    </div>

    <button id="start-btn" class="btn btn-main">カメラを起動</button>
    <button id="shutter-btn" class="btn btn-accent" style="display:none;">撮影する</button>

    <div id="memo-area" style="display:none;" class="card">
        <canvas id="photo-canvas" style="display:none;"></canvas>
        <img id="preview-img" style="width:100%; border-radius:8px; margin-bottom:10px;">
        <textarea id="memo-input" placeholder="今のこだわりや気づきをメモ..."></textarea>
        <button id="save-btn" class="btn btn-accent">保存してダウンロード</button>
        <button onclick="location.reload()" class="btn">やり直し</button>
    </div>

    <button id="copy-btn" class="btn btn-copy" style="display:none;">note用に全コピー</button>

    <div id="log-list"></div>

    <script>
        const video = document.getElementById('camera-view');
        const canvas = document.getElementById('photo-canvas');
        const previewImg = document.getElementById('preview-img');
        const memoArea = document.getElementById('memo-area');
        const startBtn = document.getElementById('start-btn');
        const shutterBtn = document.getElementById('shutter-btn');
        const saveBtn = document.getElementById('save-btn');
        const copyBtn = document.getElementById('copy-btn');
        const logList = document.getElementById('log-list');

        let allLogs = [];

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            startBtn.style.display = 'none';
            shutterBtn.style.display = 'inline-block';
        };

        shutterBtn.onclick = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            previewImg.src = canvas.toDataURL('image/png');
            document.getElementById('video-container').style.display = 'none';
            shutterBtn.style.display = 'none';
            memoArea.style.display = 'block';
        };

        saveBtn.onclick = () => {
            const projName = document.getElementById('project-name').value || "Project";
            const memoText = document.getElementById('memo-input').value;
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // ダウンロード実行
            const link = document.createElement('a');
            link.download = `SOU_${projName}_${now.getTime()}.png`;
            link.href = previewImg.src;
            link.click();

            // ログ保存
            allLogs.push({ project: projName, time: timeStr, text: memoText });
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<img src="${previewImg.src}"><br><small>${timeStr} - ${projName}</small><p>${memoText}</p>`;
            logList.prepend(item);

            // リセット
            document.getElementById('memo-input').value = '';
            memoArea.style.display = 'none';
            document.getElementById('video-container').style.display = 'block';
            shutterBtn.style.display = 'inline-block';
            copyBtn.style.display = 'block';
        };

        copyBtn.onclick = () => {
            const projName = document.getElementById('project-name').value || "制作ログ";
            let copyText = `## ${projName} の制作ログ\n\n`;
            allLogs.forEach(log => {
                copyText += `### ${log.time}\n(ここに画像を貼り付け)\n${log.text}\n\n`;
            });
            navigator.clipboard.writeText(copyText).then(() => alert("note用にコピーしました！"));
        };
    </script>
</body>
</html>
